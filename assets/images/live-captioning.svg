<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(240,2%,17%)"/>
      <stop offset="1" stop-color="hsl(240,2%,10%)"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(45,100%,72%)"/>
      <stop offset="1" stop-color="hsl(35,100%,68%)"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- waveform -->
  <g fill="url(#gold)">
    <rect x="70"  y="150" width="14" height="60"  rx="7"/>
    <rect x="100" y="120" width="14" height="120" rx="7"/>
    <rect x="130" y="90"  width="14" height="180" rx="7"/>
    <rect x="160" y="130" width="14" height="100" rx="7"/>
    <rect x="190" y="105" width="14" height="150" rx="7"/>
    <rect x="220" y="145" width="14" height="70"  rx="7"/>
    <rect x="250" y="115" width="14" height="130" rx="7"/>
    <rect x="280" y="160" width="14" height="40"  rx="7"/>
  </g>
  <!-- mic icon -->
  <g stroke="hsl(45,100%,72%)" stroke-width="10" fill="none" stroke-linecap="round">
    <rect x="480" y="80" width="60" height="110" rx="30" fill="hsl(45,100%,72%)" stroke="none"/>
    <path d="M455 155 a55 55 0 0 0 110 0"/>
    <line x1="510" y1="212" x2="510" y2="245"/>
    <line x1="480" y1="245" x2="540" y2="245"/>
  </g>
  <!-- caption lines -->
  <g fill="hsl(0,0%,84%)">
    <rect x="70" y="300" width="380" height="16" rx="8" opacity="0.9"/>
    <rect x="70" y="332" width="260" height="16" rx="8" opacity="0.5"/>
    <rect x="466" y="300" width="104" height="16" rx="8" fill="hsl(45,100%,72%)"/>
  </g>
</svg>
